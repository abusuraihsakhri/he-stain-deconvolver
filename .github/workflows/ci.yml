name: Python and Browser Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e ".[all]"
      - name: Check dependency consistency
        run: python -m pip check
      - name: Python tests and syntax
        run: |
          python -m pytest -q
          python -m compileall -q he_stain_deconvolver agents cli.py enrichment.py simulator.py
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Browser algorithm unit tests and JS syntax
        run: |
          node --check web/deconvolution.mjs
          node --check web/app.mjs
          node --test tests/browser.test.mjs

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
